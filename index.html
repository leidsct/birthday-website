<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500&family=Gochi+Hand&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1c1230;--cream:#fff6ef;--blush:#f4b8c8;--pollen:#f2a14e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#3a2459,var(--night) 62%) fixed;color:var(--cream);font:400 1.05rem/1.65 Figtree,system-ui,sans-serif}
body.locked{overflow:hidden;height:100svh}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pollen);outline-offset:3px}

/* gift gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:1.5rem;text-align:center;padding:1.5rem;
  background:radial-gradient(70% 60% at 50% 55%,#4a2b6b,var(--night));transition:opacity 1.2s ease}
#gate.done{opacity:0;pointer-events:none}
#gate h2{font-size:clamp(2rem,7vw,3.2rem);font-style:italic;margin:0}
#gate p{margin:0;opacity:.75}
.gift{position:relative;width:200px;height:200px;border:0;background:none;padding:0;animation:wiggle 2.4s ease-in-out infinite}
.gift.open{animation:none}
.box,.lid{position:absolute;left:0;right:0;margin:auto}
.box{bottom:0;width:164px;height:118px;background:linear-gradient(#d9577d,#b13b61);border-radius:6px 6px 10px 10px}
.lid{bottom:108px;width:188px;height:42px;background:linear-gradient(#ea7396,#d9577d);border-radius:8px;transition:transform .9s cubic-bezier(.3,1.6,.5,1);z-index:2}
.box::before,.lid::before{content:"";position:absolute;left:50%;width:30px;margin-left:-15px;top:0;bottom:0;background:linear-gradient(90deg,#e8b04f,#ffd98a,#e8b04f)}
.lid::after{content:"";position:absolute;left:50%;top:-26px;width:58px;height:34px;margin-left:-29px;border:9px solid #ffd98a;border-radius:50% 50% 40% 40%}
.glow{position:absolute;left:50%;bottom:90px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(#fff3c9,transparent 70%);opacity:0;transition:opacity .8s .3s;z-index:1}
.gift.open .lid{transform:translateY(-78px) rotate(-16deg)}
.gift.open .glow{opacity:1}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}

/* hero + lilies */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;overflow:hidden}
.hero .txt{position:relative;z-index:2;max-width:38rem}
.hero h1{font-size:clamp(3rem,12vw,7.5rem);font-style:italic;line-height:1;margin:0 0 1rem;text-shadow:0 4px 40px rgba(28,18,48,.7)}
.hero p{margin:0;font-size:1.15rem;opacity:.85;text-shadow:0 2px 18px rgba(28,18,48,.9)}
#garden{position:absolute;inset:0;z-index:1}
.lw{position:absolute;width:calc(var(--s)*1vmin);aspect-ratio:1;translate:-50% -50%}
.lw svg{width:100%;height:100%;overflow:visible;transform:rotate(var(--r))}
.lw>div{width:100%;height:100%}
.bloom .lw>div{animation:sway 6s ease-in-out infinite alternate calc(var(--d)*1s + 2.5s)}
@keyframes sway{to{transform:rotate(4deg)}}
.p{transform-box:view-box;transform-origin:0 0;transform:rotate(calc(var(--a) - 30deg)) scale(.03);transition:transform 1.5s cubic-bezier(.2,1.25,.35,1) calc(var(--d)*1s + var(--i)*.07s)}
.st{opacity:0;transition:opacity 1s calc(var(--d)*1s + .9s)}
.bloom .p{transform:rotate(var(--a)) scale(1)}
.bloom .st{opacity:1}
.fall{position:fixed;top:-5vh;z-index:40;width:14px;height:20px;border-radius:70% 0 70% 0;background:linear-gradient(#fff,var(--blush));pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--t))}}
#burst{position:fixed;inset:0;z-index:30;pointer-events:none;transition:opacity 1.5s}

/* bouquet */
.bq{position:relative;z-index:2;width:min(64vw,300px);aspect-ratio:5/6;margin-top:1.2rem;opacity:0;translate:0 40px;transition:opacity 1s .3s,translate 1.4s cubic-bezier(.2,1.2,.4,1) .3s}
.bq.bloom{opacity:1;translate:0}
.bq .bs{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bq .lw{width:calc(var(--w)*1%)}
.stems path{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease .2s}
.bloom .stems path{stroke-dashoffset:0}
.leaves{opacity:0;transition:opacity 1s 1.2s}
.bloom .leaves{opacity:1}

/* timeline */
main{max-width:980px;margin:0 auto;padding:4rem 1.5rem}
main h2{font-size:clamp(2.2rem,6vw,3.4rem);text-align:center;margin:0 0 3.5rem;font-style:italic}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:linear-gradient(var(--blush),rgba(244,184,200,.1))}
.tl li{position:relative;padding:0 0 3rem 48px;opacity:0;translate:0 24px;transition:opacity .9s,translate .9s}
.tl li.in{opacity:1;translate:0}
.tl li::before{content:"";position:absolute;left:6px;top:.55rem;width:18px;height:18px;border-radius:50%;background:var(--pollen);box-shadow:0 0 0 6px rgba(242,161,78,.22)}
.when{font:italic 600 1.3rem "Cormorant Garamond",serif;color:var(--pollen)}
.tl h3{font-size:2rem;line-height:1.15;margin:.1rem 0 .5rem}
.tl p{margin:0;max-width:30rem;color:rgba(255,246,239,.85)}
.tl img{display:block;max-width:100%;width:280px;aspect-ratio:4/5;object-fit:cover;margin-top:1rem;padding:8px 8px 30px;background:var(--cream);border-radius:3px;rotate:-2deg;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tl li:nth-child(even) img{rotate:2deg}
@media(min-width:800px){
 .tl::before{left:50%}
 .tl li{width:50%;padding:0 52px 3.5rem 0;text-align:right}
 .tl li p,.tl li img{margin-left:auto}
 .tl li:nth-child(even){margin-left:50%;padding:0 0 3.5rem 52px;text-align:left}
 .tl li:nth-child(even) p,.tl li:nth-child(even) img{margin-left:0}
 .tl li::before{left:auto;right:-9px}
 .tl li:nth-child(even)::before{right:auto;left:-9px}
}

/* letter */
.letter{max-width:34rem;margin:2rem auto 0;padding:0 1.5rem 8rem;text-align:center}
.letter p{font:500 clamp(1.35rem,4vw,1.7rem)/1.55 "Cormorant Garamond",serif;margin:0 0 1.2rem}
.letter .sig{font-style:italic;color:var(--blush);margin-bottom:2.2rem}
.again{background:transparent;color:var(--cream);border:1.5px solid var(--blush);border-radius:99px;padding:.7rem 1.6rem;transition:background .25s}
.again:hover{background:rgba(244,184,200,.18)}

/* music */
#mus{position:fixed;right:16px;bottom:16px;z-index:45;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--blush);background:rgba(28,18,48,.7);color:var(--cream);font-size:1.3rem;display:none;backdrop-filter:blur(6px)}
#mus.off{opacity:.55;text-decoration:line-through}
/* Part 1: postcards */
#pc{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;color:#fff;font-family:"Pixelify Sans",monospace;transition:opacity 1s}
#pc.out{opacity:0;pointer-events:none}
#pc.on #pcs{display:none}
#pcs{text-align:center;padding:1.5rem}
#pcs .mail{font-size:5.5rem;line-height:1;animation:bob 1.2s steps(2) infinite}
#pcs p{font:1.7rem "Gochi Hand",cursive;margin:.5rem 0 1.4rem}
#pcs button{font:700 1.1rem "Pixelify Sans",monospace;background:#fff;color:#000;border:3px solid #fff;padding:.5rem 1.8rem;box-shadow:4px 4px 0 #888}
#pc .win{display:none;container-type:inline-size;width:min(96vw,640px);aspect-ratio:880/600;max-height:94svh;grid-template-columns:1fr 24%;grid-template-rows:7% 1fr 11%;background:repeating-conic-gradient(#9d9d9d 0 25%,#ececec 0 50%) 0 0/4px 4px;animation:shim .9s steps(2) infinite;color:#000;border:2px solid #fff}
#pc.on .win{display:grid}
#pc .bar{grid-column:1/-1;display:flex;align-items:center;gap:2.4cqw;padding:0 1.5cqw;background:#fff;border-bottom:2px solid #000;font-size:2.7cqw}
#pc .bar b{background:#000;color:#fff;padding:0 1.2cqw;font-weight:500}
#pc .bar em{margin-left:auto;font-style:normal;animation:blink 1s steps(1) infinite}
#pc #cnv{position:relative;margin:2cqw 1cqw 1.2cqw 2cqw;background:#fff;border:2px solid #000;overflow:hidden;cursor:pointer}
#pc .pal{display:flex;flex-direction:column;gap:1cqw;padding:2cqw 0 1.2cqw 1.2cqw}
#pc .pn{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:1.5cqw;background:#fff;border:2px solid #000;border-right:0;border-radius:99px 0 0 99px;font:700 2.5cqw "Pixelify Sans",monospace;overflow:hidden;transition:translate .3s steps(3)}
#pc .pn.on{translate:-3cqw 0}
#pc .pn.m::before{content:"";align-self:stretch;width:5cqw;margin-right:auto;background:var(--c);border-right:2px solid #000}
#pc .bot{grid-column:1/-1;display:flex;align-items:center;gap:1.4cqw;padding:0 1.5cqw;font:700 2.7cqw "Pixelify Sans",monospace}
#pc .bot span{background:#fff;border:2px solid #000;padding:0 1.2cqw}
#pc .bot .oops{background:#000;color:#fff;animation:blink 1.4s steps(1) infinite}
#pc .bot .sz{display:grid;place-items:center;width:9cqw;height:5cqw;padding:0}
#pc .knob{background:#000;animation:kn 2.4s steps(1) infinite}
#pc .bot .ob{margin-left:auto}
#pc .tx{position:absolute;top:5%;left:0;right:0;padding:0 5%;text-align:center;font:7cqw/1.1 "Gochi Hand",cursive;z-index:2}
#pc .tx span{opacity:0;animation:pop .01s steps(1,start) forwards}
#pc .art{position:absolute;left:50%;bottom:2%;width:60%;translate:-50% 0}
#pc .art *{fill:none;stroke:#000;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s steps(16) .3s forwards}
#pc .art .f{stroke:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:0;animation:pop .01s steps(1,start) 1.7s forwards}
#pc .art .twinkle circle{animation:starTwinkle 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
#pc .art .twinkle circle:nth-child(2n){animation-delay:.45s}
#pc .art .firework{transform-box:fill-box;transform-origin:center;animation:fireworkPulse 1.8s ease-out infinite}
#pc .art .fw-two{animation-delay:.45s}#pc .art .fw-three{animation-delay:.9s}
#pc .art .rose-bloom{transform-box:fill-box;transform-origin:center;animation:roseSway 3s ease-in-out infinite}
#pc .art .letter-envelope{transform-box:fill-box;transform-origin:center;animation:letterFloat 2.8s ease-in-out infinite}
@keyframes starTwinkle{from{opacity:.45;transform:scale(.75)}to{opacity:1;transform:scale(1.25)}}
@keyframes fireworkPulse{0%,100%{opacity:.55;transform:scale(.78)}50%{opacity:1;transform:scale(1.08)}}
@keyframes roseSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes letterFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

#pc .stk{position:absolute;width:22%;aspect-ratio:4/5;object-fit:cover;background:#fff;border:2px solid #000;padding:2px;animation:stk .01s steps(1,start) 2.2s both}
#pc .s0{right:3%;bottom:5%;rotate:5deg}
#pc .s1{left:3%;bottom:5%;rotate:-6deg}
#pc .fin .stk{width:25%}
#pc .msg{position:absolute;top:34%;left:6%;right:6%;margin:0;text-align:center;font:4.6cqw/1.3 "Gochi Hand",cursive}
#pc #go{position:absolute;left:50%;bottom:5%;translate:-50% 0;font:700 3cqw "Pixelify Sans",monospace;background:#000;color:#fff;border:0;padding:1.2cqw 2.4cqw;animation:blink 1.2s steps(1) infinite}
#pc .cur{position:absolute;z-index:3;font-style:normal;font-size:6cqw;animation:wander 8s steps(30) infinite;pointer-events:none}
@keyframes pop{to{opacity:1}}
@keyframes stk{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.15}}
@keyframes shim{to{background-position:4px 0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes kn{0%{width:1cqw;height:1cqw}33%{width:2.4cqw;height:2.4cqw}66%{width:3.6cqw;height:3.6cqw}}
@keyframes wander{0%{left:8%;top:68%}25%{left:62%;top:28%}50%{left:28%;top:56%}75%{left:74%;top:74%}100%{left:8%;top:68%}}
@media(prefers-reduced-motion:reduce){#pc .tx span,#pc .art .f,#pc .stk{opacity:1!important}#pc .art *{stroke-dashoffset:0!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* ===== Romantic lily bouquet upgrade ===== */
.lily-gift{position:relative;width:min(92vw,470px);margin:1.6rem auto 2.4rem;padding:1rem 0 0;opacity:0;transform:translateY(34px) scale(.96);transition:opacity 1s ease,transform 1.25s cubic-bezier(.2,1.1,.3,1)}
.lily-gift.reveal{opacity:1;transform:translateY(0) scale(1)}
.lily-art{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 18px 28px rgba(0,0,0,.22))}
.lily-stem{fill:none;stroke:#668e70;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)}
.lily-gift.reveal .lily-stem{stroke-dashoffset:0}
.lily-leaf{fill:url(#leafShade);transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .85s cubic-bezier(.2,1.5,.4,1)}
.lily-gift.reveal .lily-leaf{transform:scale(1)}
.lily-wrap-back{fill:#f6dce2;stroke:#f9e9e8;stroke-width:2}
.lily-wrap-front{fill:url(#wrapShade);stroke:#fff0ec;stroke-width:2}
.lily-wrap-fold{fill:none;stroke:rgba(255,255,255,.58);stroke-width:2}
.lily-ribbon{fill:#c85c7b;stroke:#f2a5b8;stroke-width:1.5;transform-box:fill-box;transform-origin:center;transform:scale(.2);opacity:0;transition:transform .8s .9s cubic-bezier(.2,1.6,.3,1),opacity .4s .9s}
.lily-gift.reveal .lily-ribbon{transform:scale(1);opacity:1}
.lily-petal{fill:url(#petalShade);stroke:#e7a6b8;stroke-width:1.8;transform-box:fill-box;transform-origin:50% 90%;transform:scale(.025);opacity:.2;transition:transform 1.1s cubic-bezier(.18,1.35,.35,1),opacity .6s}
.lily-gift.reveal .lily-petal{transform:scale(1);opacity:1}
.lily-flower > g:nth-child(1) .lily-petal{transition-delay:.25s}.lily-flower > g:nth-child(2) .lily-petal{transition-delay:.34s}.lily-flower > g:nth-child(3) .lily-petal{transition-delay:.43s}.lily-flower > g:nth-child(4) .lily-petal{transition-delay:.52s}.lily-flower > g:nth-child(5) .lily-petal{transition-delay:.61s}.lily-flower > g:nth-child(6) .lily-petal{transition-delay:.70s}
.lily-center{fill:#d99a3b;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:all .55s .9s cubic-bezier(.2,1.6,.3,1)}
.lily-gift.reveal .lily-center{opacity:1;transform:scale(1)}
.lily-stamen{stroke:#d89b3e;stroke-width:2.5;stroke-linecap:round;opacity:0;transition:opacity .5s 1s}
.lily-gift.reveal .lily-stamen{opacity:1}
.lily-flower{transform-box:fill-box;transform-origin:center;animation:lilyFloat 5.5s ease-in-out infinite;animation-play-state:paused}
.lily-gift.reveal .lily-flower{animation-play-state:running}
.lily-flower.f2{animation-delay:-1.3s}.lily-flower.f3{animation-delay:-2.2s}.lily-flower.f4{animation-delay:-.7s}.lily-flower.f5{animation-delay:-3s}.lily-flower.f6{animation-delay:-1.8s}
@keyframes lilyFloat{0%,100%{translate:0 0;rotate:-1deg}50%{translate:0 -5px;rotate:1deg}}
.lily-sparkle{position:absolute;z-index:2;color:#ffe6a8;font-size:1.15rem;opacity:0;filter:drop-shadow(0 0 8px rgba(255,220,155,.8));pointer-events:none}
.lily-gift.reveal .lily-sparkle{animation:sparkle 2.8s ease-in-out infinite}
.lily-sparkle.s1{left:8%;top:25%;animation-delay:.2s}.lily-sparkle.s2{right:8%;top:32%;animation-delay:1s}.lily-sparkle.s3{left:18%;top:58%;animation-delay:1.6s}.lily-sparkle.s4{right:18%;top:14%;animation-delay:.7s}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:.95;transform:scale(1.15) rotate(35deg)}70%{opacity:.25;transform:scale(.7) rotate(70deg)}}
.lily-caption {
  width: 100%;
  max-width: 100%;
  margin: 0 auto 1.6rem;
  padding: 0 15px;
  text-align: center;
  color: #f4b8c8;
  font: italic 600 clamp(1.35rem, 4.5vw, 1.8rem)/1.35 "Cormorant Garamond", Georgia, serif;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .8s 1.7s, transform .8s 1.7s;
}
.lily-gift.reveal + .lily-caption{opacity:1;transform:translateY(0)}
.lily-petal-fall{position:fixed;z-index:38;top:-35px;width:13px;height:20px;border-radius:90% 8% 90% 8%;background:linear-gradient(135deg,#fff8f5,#efadc0 70%,#d97998);box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none;animation:lilyFall linear forwards}
@keyframes lilyFall{to{transform:translate3d(var(--drift),110vh,0) rotate(var(--spin));opacity:.12}}
@media(max-width:480px){.lily-gift{width:min(96vw,410px);margin-top:1rem}.lily-caption{padding:0 1rem}}
@media(prefers-reduced-motion:reduce){.lily-flower{animation:none!important}.lily-gift,.lily-gift *{transition-duration:.01ms!important;animation-duration:.01ms!important}}

</style>
</head>
<body class="locked">
<div id="pc">
  <div id="pcs"><div class="mail">✉</div><p id="pcsT"></p><button id="pcOpen">Open</button></div>
  <div class="win">
    <div class="bar"><b>Decker</b><span>File</span><span>Edit</span><span>Card</span><span>Tool</span><span>Help</span><em>♥ ♥ ♥</em></div>
    <div id="cnv"></div>
    <div class="pal" id="pal"></div>
    <div class="bot"><span>EXPORT</span><span>CROP</span><span class="oops">OOPS!</span><span class="sz"><i class="knob"></i></span><span class="ob">OBLITERATE!</span></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf5"/><stop offset=".65" stop-color="#fbe2ea"/><stop offset="1" stop-color="#ee9fb6"/></linearGradient></defs></svg>

<div id="gate">
  <h2 id="gateTitle"></h2>
  <button class="gift" id="gift" aria-label="Open the gift"><span class="glow"></span><span class="lid"></span><span class="box"></span></button>
  <p>Tap the gift</p>
</div>

<section class="hero">
  <div id="garden"></div>
  <div class="txt">
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
  </div>
  <div class="bq" id="bq"></div>
</section>

<main>
  <h2>Our story</h2>
  <ol class="tl" id="tl"></ol>
</main>

<section class="letter" id="letter">
  <div id="letterText"></div>
  <p class="sig" id="sig"></p>
  <div class="lily-gift" id="lilyGift" aria-label="A hand-wrapped bouquet of blooming lilies">
    <span class="lily-sparkle s1">✧</span><span class="lily-sparkle s2">✦</span><span class="lily-sparkle s3">✧</span><span class="lily-sparkle s4">✦</span>
    <svg class="lily-art" viewBox="0 0 420 470" role="img" aria-label="Seven pink and ivory lilies in a ribbon-wrapped bouquet">
      <defs>
        <linearGradient id="petalShade" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffaf7"/><stop offset=".55" stop-color="#f9dfe7"/><stop offset="1" stop-color="#e99bb3"/></linearGradient>
        <linearGradient id="wrapShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1e9"/><stop offset=".55" stop-color="#f3cbd7"/><stop offset="1" stop-color="#e8aabd"/></linearGradient>
        <linearGradient id="leafShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9fbd91"/><stop offset="1" stop-color="#527d60"/></linearGradient>
        <linearGradient id="wrapBack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8e5df"/><stop offset="1" stop-color="#d99aae"/></linearGradient>
      </defs>
      <!-- stems grow from the tied bouquet -->
      <g fill="none" stroke="#668e70" stroke-width="5.5" stroke-linecap="round">

  }
  requestAnimationFrame(() => b.classList.add("bloom"));
  setTimeout(() => { b.style.opacity = 0 }, 4500);
  setTimeout(() => { b.innerHTML = ""; b.classList.remove("bloom") }, 6200);
}

const audio = $("audio"), mus = $("mus");
function setMus(on) { mus.classList.toggle("off", !on); on ? audio.play().catch(() => {}) : audio.pause(); }
mus.onclick = () => setMus(audio.paused);
audio.onplaying = () => mus.classList.remove("off");
audio.onerror = () => { mus.classList.add("off"); console.warn("music.mp3 could not be loaded"); };

let opened = false;
$("gift").onclick = () => {
  if (opened) return; opened = true;
  $("gift").classList.add("open");
  mus.style.display = "block"; audio.play().catch(() => mus.classList.add("off"));
  setTimeout(() => $("gate").classList.add("done"), 1300);
  setTimeout(() => {
    document.body.classList.remove("locked");
    $("garden").classList.add("bloom"); bq.classList.add("bloom");
    burst(10);
  }, 1600);
  setTimeout(() => $("gate").remove(), 3000);
};
$("again").onclick = () => burst(16);

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .25 });
document.querySelectorAll(".tl li").forEach(li => io.observe(li));

/* ===== Part 1: postcards ===== */
const P = CONFIG.intro, pc = $("pc"), cnv = $("cnv"), pal = $("pal");
const a1 = new Audio(P.music); a1.loop = true;
$("pcsT").textContent = `A postcard for you, ${CONFIG.name}`;
const H = "M0 -6C-6 -18 -24 -12 -22 2C-20 14 -6 20 0 28C6 20 20 14 22 2C24 -12 6 -18 0 -6Z";
const tf = (x, y, k) => `transform="translate(${x} ${y}) scale(${k})"`;
const hf = (x, y, k, c) => `<path class="f" style="fill:${c}" d="${H}" ${tf(x, y, k)}/>`;
const hl = (x, y, k) => `<path d="${H}" ${tf(x, y, k)}/>`;
const dot = (x, y, c) => `<circle class="f" style="fill:${c}" cx="${x}" cy="${y}" r="3.5"/>`;
const B5 = [[70,42,.8,"#f08080"],[100,30,.8,"#c060d0"],[130,44,.8,"#f6a0b8"],[85,66,.75,"#c060d0"],[116,64,.75,"#f08080"]];
const STAR = "M100 22L116 62L158 64L125 90L136 130L100 106L64 130L75 90L42 64L84 62Z";
const ART = {
  envelope: `<rect class="f" style="fill:#f6a0b8" x="130" y="88" width="20" height="18"/><path d="M40 50H160V115H40Z"/><path d="M40 50L100 92L160 50"/><path d="M40 115L82 80M160 115L118 80"/><rect x="130" y="88" width="20" height="18"/>`,
  plane: `<path d="M30 72L172 24L122 108L102 78Z"/><path d="M172 24L102 78"/><path d="M102 78L98 102L122 108"/><circle cx="22" cy="118" r="2"/><circle cx="40" cy="125" r="2"/><circle cx="60" cy="118" r="2"/>`,
  bouquet: B5.map(b => hf(...b)).join("") + B5.map(b => hl(b[0], b[1], b[2])).join("") + `<path d="M100 90V118M86 86L97 118M114 86L103 118"/><path d="M82 108H118L112 138H88Z"/>`,
  moon: `<circle class="f" style="fill:#f2d83a" cx="40" cy="28" r="4"/><circle class="f" style="fill:#f2d83a" cx="165" cy="100" r="4"/><circle class="f" style="fill:#f2d83a" cx="120" cy="22" r="4"/><circle class="f" style="fill:#f2d83a" cx="30" cy="110" r="4"/><path d="M95 28C58 36 48 82 78 108C98 124 128 120 146 106C108 108 84 72 95 28Z"/><path d="M150 38V56M141 47H159"/><path d="M52 95V107M46 101H58"/>`,
  heart: hf(100, 62, 2.2, "#f4828c") + hl(100, 62, 2.2),
  beat: hf(100, 62, 2.3, "#f4828c") + hl(100, 62, 2.3) + `<path d="M8 78H52L64 52L78 104L94 30L110 112L126 58L136 78H192"/>`,
  road: `<path class="f" style="fill:#2e8b2e" d="M78 142C108 114 146 90 186 36L200 36V145Z"/><path class="f" style="fill:#2e8b2e" d="M24 142C60 104 112 72 152 18L0 18V142Z"/>` + dot(150,100,"#f6a0b8") + dot(176,76,"#c060d0") + dot(130,128,"#c060d0") + dot(40,60,"#f6a0b8") + dot(20,100,"#c060d0") + dot(70,40,"#f6a0b8") + `<path d="M24 142C60 104 112 72 152 18"/><path d="M78 142C108 114 146 90 186 36"/><path d="M50 118L60 108M84 96L96 86M118 70L128 62"/>`,
  star: `<path class="f" style="fill:#f2d83a" d="${STAR}"/><path d="${STAR}"/>`,
  flame: `<path class="f" style="fill:#f06020" d="M100 22C108 52 138 60 132 92C128 114 112 124 100 124C84 124 68 112 70 90C72 72 90 62 92 44C96 50 98 38 100 22Z"/><path class="f" style="fill:#f2d83a" d="M100 70C106 86 120 92 114 108C111 116 105 118 100 118C92 118 86 112 87 104C88 96 97 90 100 70Z"/><path d="M100 22C108 52 138 60 132 92C128 114 112 124 100 124C84 124 68 112 70 90C72 72 90 62 92 44C96 50 98 38 100 22Z"/>`,
  loveletter: `<g class="letter-envelope"><rect class="f" style="fill:#f8d4df" x="42" y="48" width="116" height="78" rx="7"/><path d="M42 55L100 98L158 55M42 126L82 91M158 126L118 91"/><path class="f" style="fill:#d9577d" d="M100 61C88 43 68 57 100 83C132 57 112 43 100 61Z"/><path d="M100 106V132"/><path class="f" style="fill:#fff5f1" d="M100 132L94 124L106 124Z"/></g>`,
  constellation: `<g class="constellation-lines"><path d="M30 38L73 64L119 30L164 73L133 119L75 112L30 38Z"/></g><g class="twinkle"><circle class="f" style="fill:#ffe6a8" cx="30" cy="38" r="5"/><circle class="f" style="fill:#ffe6a8" cx="73" cy="64" r="6"/><circle class="f" style="fill:#ffe6a8" cx="119" cy="30" r="5"/><circle class="f" style="fill:#ffe6a8" cx="164" cy="73" r="6"/><circle class="f" style="fill:#ffe6a8" cx="133" cy="119" r="5"/><circle class="f" style="fill:#ffe6a8" cx="75" cy="112" r="5"/></g><path d="M45 20V31M39 25H51M176 111V122M170 116H182"/>`,
  rose: `<path d="M100 78Q96 108 101 139"/><path class="f" style="fill:#6f9a74" d="M99 119Q64 91 51 117Q73 139 99 119Z"/><path class="f" style="fill:#6f9a74" d="M101 129Q135 98 151 122Q128 146 101 129Z"/><g class="rose-bloom"><path class="f" style="fill:#f3a2b9" d="M100 79C67 75 62 45 83 37C94 33 101 43 100 52C105 32 132 34 138 52C145 73 119 84 100 79Z"/><path class="f" style="fill:#e8799b" d="M100 78C77 68 82 48 96 49C108 47 117 64 100 78Z"/><path d="M100 79C67 75 62 45 83 37C94 33 101 43 100 52C105 32 132 34 138 52C145 73 119 84 100 79Z"/></g>`,
  fireworks: `<g class="firework fw-one"><path d="M53 48V17M53 79V110M22 63H-2M84 63H108M31 41L9 19M75 85L97 107M75 41L97 19M31 85L9 107"/><circle class="f" style="fill:#f3a2b9" cx="53" cy="63" r="8"/></g><g class="firework fw-two"><path d="M145 76V48M145 104V132M117 90H89M173 90H201M125 70L105 50M165 110L185 130M165 70L185 50M125 110L105 130"/><circle class="f" style="fill:#ffe6a8" cx="145" cy="90" r="7"/></g><g class="firework fw-three"><path d="M105 32V13M105 51V70M86 42H67M124 42H143M92 29L79 16M118 55L131 68M118 29L131 16M92 55L79 68"/><circle class="f" style="fill:#c9b2f0" cx="105" cy="42" r="5"/></g>`
};
pal.innerHTML = ["", "", "", "", "", "pink", "cyan", "yellow"].map((n, i) => `<div class="pn${n ? " m" : ""}"${n ? ` style="--c:${["#f6a0b8", "#b05cd0", "#f2d83a"][i - 5]}"` : ""}>${n}</div>`).join("");

let ci = 0, tm;
function show(i) {
  clearTimeout(tm); ci = i;
  const last = i >= P.cards.length;
  const c = last ? { text: `Happy Birthday, ${CONFIG.name}`, photos: [IMG.walk, IMG.selfie] } : P.cards[i];
  cnv.className = last ? "fin" : "";
  cnv.innerHTML = `<div class="tx">${c.text.split(" ").map((w, k) => `<span style="animation-delay:${k * .16}s">${w}</span>`).join(" ")}</div>`
    + (last ? "" : `<svg class="art" viewBox="0 0 200 145" aria-hidden="true">${ART[c.art] || ""}</svg>`)
    + (c.photos || []).map((p, k) => `<img class="stk s${k}" src="${p}" alt="">`).join("")
    + (last ? `<p class="msg">${P.finalMsg}</p><button id="go">Open your gift</button>` : "")
    + `<i class="cur">✎</i>`;
  cnv.querySelectorAll(".art *:not(.f)").forEach(e => e.setAttribute("pathLength", 1));
  [...pal.children].forEach((e, k) => e.classList.toggle("on", k === i % 8));
  if (!last) tm = setTimeout(() => show(i + 1), (c.sec || P.sec) * 1000);
}
$("pcOpen").onclick = () => { pc.classList.add("on"); a1.play().catch(() => {}); show(0); };
cnv.onclick = e => {
  if (e.target.id === "go") {
    let n = 0; const f = setInterval(() => { a1.volume = Math.max(0, 1 - ++n * .1); if (n >= 10) { a1.pause(); clearInterval(f); } }, 120);
    pc.classList.add("out"); setTimeout(() => pc.remove(), 1100);
  } else if (ci < P.cards.length) show(ci + 1);
};


// Reveal the hand-tied lily bouquet and let a few petals drift down.
const lilyGift = document.getElementById("lilyGift");
if (lilyGift) {
  const lilyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      lilyGift.classList.add("reveal");
      lilyObserver.disconnect();
      for (let i = 0; i < 18; i++) {
        const petal = document.createElement("i");
        petal.className = "lily-petal-fall";
        petal.style.left = `${Math.random() * 100}vw`;
        petal.style.setProperty("--drift", `${Math.random() * 180 - 90}px`);
        petal.style.setProperty("--spin", `${Math.random() * 720 - 360}deg`);
        petal.style.animationDuration = `${6 + Math.random() * 5}s`;
        petal.style.animationDelay = `${Math.random() * 2}s`;
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 14000);
      }
    });
  }, { threshold: .28 });
  lilyObserver.observe(lilyGift);
}

</script>
